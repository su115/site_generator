
name: Release workflow
on:
 workflow_dispatch:
  inputs:
   tag_version:
    description: 'Версія релізу (наприклад, v1.0.2)'
    required: true
    type: string
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download repo 
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Turn on cache
        uses: actions/cache@v6
        with:
            path: ~/.cache/pypoetry
            key: poetry-cache-${{ hashFiles('poetry.lock') }}
        
      - name: Install Poetry
        uses: snok/install-poetry@v1
      
      - name: Poetry install packages
        run: poetry install

      - name: Create Git Tag
        run: |
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git tag ${{ inputs.tag_version }}
           git push origin ${{ inputs.tag_version }}

      - name: Update poetry version
        run: poetry version ${{ inputs.tag_version }}
  
      - name: Build artifact
        run: poetry build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
