[tool.poetry]
name = "sitegen"
version = "0.1.0"
description = "Simple site generator."
authors = ["Ihor <ihor.prots.lviv@gmail.com>"]
readme = "README.md"

[tool.poetry.scripts]
sitegen = "sitegen.cli:app"

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.27.3"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
jsonschema = "^4.26.0"


[tool.poetry.group.dev.dependencies]
coverage = { version = "^7.17.0", python = ">=3.11,<4.0" }
pytest = "^9.2.0"
parameterized = "^0.9.0"
mypy = "^2.4.0"
types-jsonschema = "^4.26.0.20261006"
types-pyyaml = "^6.0.12.20260906"
ruff = "^0.17.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
src = ["sitegen"]
exclude = ["python_environment", "tests"]
line-length = 150
target-version = "py38"


[tool.mypy]
files = "sitegen/"
show_error_codes = true
show_column_numbers = true
strict = true
exclude = "tests/"



[tool.coverage.run]
source = ["sitegen"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/__init__.py",
]
show_missing = true

