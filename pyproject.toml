[tool.poetry]
name = "sitegen"
version = "0.1.0"
description = "Simple site generator."
authors = ["Ihor <ihor.prots.lviv@gmail.com>"]
readme = "README.md"

[tool.poetry.scripts]
sitegen = "sitegen.cli:app"

[tool.poetry.dependencies]
python = "~3.13"
pytest = ">=8.0,<8.4"
ruff = "^0.14.5"
mypy = ">=1.5.1"
coverage = "7"
parameterized = "^0.9.0"
jsonschema = "4.2.0"
jinja2 = "^3.1.6"
types-jsonschema = "4.2.0"
beautifulsoup4 = "^4.14.3"
lxml = "^6.0.2"
typer = {version = "0.20.0", extras = ["all"]}
pyyaml = "^6.0.3"
types-pyyaml = "^6.0.12.20260906"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
src = ["sitegen"]
exclude = ["python_environment", "tests"]
line-length = 150
target-version = "py38"


[tool.mypy]
files = "sitegen/"
show_error_codes = true
show_column_numbers = true
strict = true
exclude = "tests/"



[tool.coverage.run]
source = ["sitegen"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/__init__.py",
]
show_missing = true

